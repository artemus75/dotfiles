"$schema" = 'https://starship.rs/config-schema.json'

# ══════════════════════════════════════════════════════════════════
#  Starship – Catppuccin Macchiato
#  Layout: [OS user ▶ directory] (git) (languages) (infrastructure) (time)
#  Optional segments only appear when they have something to show.
#  The symbols require a Nerd Font in the terminal.
# ══════════════════════════════════════════════════════════════════

palette = 'catppuccin_macchiato'
add_newline = true
command_timeout = 1000

format = """
[](red)\
$os\
$username\
$hostname\
[ ](bg:red)\
[](bg:peach fg:red)\
$directory\
[](fg:peach)\
( [](fg:yellow)$git_branch$git_status[](fg:yellow))\
( [](fg:green)$c$rust$golang$nodejs$bun$php$java$kotlin$haskell$python[](fg:green))\
( [](fg:sapphire)$docker_context$kubernetes$terraform$azure$conda[](fg:sapphire))\
( [](fg:lavender)$time[](fg:lavender))\
$cmd_duration\
$status\
$line_break\
$character"""


# ── Start of the line: operating system, user, directory ──────────

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = " "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = "󰣇 "
Artix = "󰣇 "
CachyOS = " "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Void = " "

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[$user]($style)'

# Hostname only in SSH sessions (e.g. on Talos nodes or servers)
[hostname]
ssh_only = true
style = "bg:red fg:crust"
format = '[@$hostname]($style)'

[directory]
style = "bg:peach fg:crust"
read_only = " "
read_only_style = "bg:peach fg:red"
format = "[ $path]($style)[$read_only]($read_only_style)[ ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
# English and German (localized) folder names
"Documents" = "󰈙 "
"Dokumente" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Musik" = "󰝚 "
"Pictures" = " "
"Bilder" = " "
"Developer" = "󰲋 "


# ── Git ───────────────────────────────────────────────────────────

[git_branch]
symbol = ""
style = "bg:yellow"
truncation_length = 24
truncation_symbol = "…"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'


# ── Programming languages (green segment) ─────────────────────────

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[bun]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'


# ── Infrastructure (blue segment) ─────────────────────────────────

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

# Kubernetes context: only shown in directories related to Kubernetes or
# Terraform. Delete the three detect_* lines to show it everywhere.
[kubernetes]
disabled = false
symbol = "󱃾"
style = "bg:sapphire"
format = '[[ $symbol $context( \($namespace\)) ](fg:crust bg:sapphire)]($style)'
detect_extensions = ['yaml', 'yml', 'tf']
detect_files = ['Chart.yaml', 'kustomization.yaml', 'talosconfig', 'Dockerfile']
detect_folders = ['k8s', 'kubernetes', 'manifests']

# Talos contexts are named "admin@<cluster>"; only the cluster name is shown
[[kubernetes.contexts]]
context_pattern = 'admin@(?P<var_cluster>.+)'
context_alias = '$var_cluster'

[terraform]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $workspace) ](fg:crust bg:sapphire)]($style)'

# Azure subscription: disabled by default (shows the subscription name).
# Set disabled = false to enable it.
[azure]
disabled = true
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $subscription) ](fg:crust bg:sapphire)]($style)'

[conda]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol $environment ](fg:crust bg:sapphire)]($style)'
ignore_base = false


# ── Time, duration, exit code, input line ─────────────────────────

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[cmd_duration]
disabled = false
min_time = 2000
show_milliseconds = true
style = "fg:overlay1"
format = "[  in $duration ]($style)"
show_notifications = true
min_time_to_notify = 45000

# Only show the exit code when the last command failed
[status]
disabled = false
symbol = "✖"
style = "bold fg:red"
format = '[ $symbol $status ]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'


# ── Color palette ─────────────────────────────────────────────────

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"
